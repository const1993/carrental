services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carrental
      POSTGRES_USER: carrental
      POSTGRES_PASSWORD: carrental
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrental -d carrental"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - carrental-postgres:/var/lib/postgresql/data

volumes:
  carrental-postgres:
