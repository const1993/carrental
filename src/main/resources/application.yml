spring:
  application:
    name: car-rental-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carrental}
    username: ${DB_USERNAME:carrental}
    password: ${DB_PASSWORD:carrental}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  company-id: ${APP_COMPANY_ID:00000000-0000-0000-0000-000000000001}
  fleet:
    search-radius-km: ${VEHICLE_SEARCH_RADIUS_KM:25}
  reservation:
    cleanup-interval: ${RESERVATION_CLEANUP_INTERVAL:PT30S}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes-minimum}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
